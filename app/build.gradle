plugins {
    id 'com.android.application'
}

apply plugin: 'com.yanzhenjie.andserver'
// Add the information to the bottom of the file.
apply plugin: 'com.huawei.agconnect'

android {
    namespace 'com.example.nsyy'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.nsyy"
        minSdk 24
        targetSdk 33
        versionCode 4
        versionName "4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 自定义打包名称
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NsyyAPK_${buildType.name}_v${versionName}_${generateTime()}.apk"
        }
    }

    signingConfigs {
        config {
            // 根据您实际的签名信息，替换以下参数中的xxxx
            keyAlias 'generateapk'
            keyPassword '123456'
            storeFile file('/Users/gaoyanliang/nsyy/android/APK/GenerateAPK.jks')
            storePassword '123456'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    //解决support-annotations版本冲突
    configurations.all {
        resolutionStrategy.force 'com.android.support:support-annotations:26.0.0'
    }

}

//构建时间
def generateTime() {
    return new Date().format("yyyyMMdd")
}

dependencies {
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // webview 刷新
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 权限相关
    implementation 'com.github.getActivity:XXPermissions:18.3'

    // 谷歌兼容库：https://developer.android.google.cn/jetpack/androidx/releases/appcompat?hl=zh-cn
    // noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // 吐司框架：https://github.com/getActivity/Toaster
    implementation 'com.github.getActivity:Toaster:12.3'

    // 内存泄漏检测：https://github.com/square/leakcanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'

    // AndServer： https://github.com/yanzhenjie/AndServer
    implementation 'com.yanzhenjie.andserver:api:2.1.12'
    annotationProcessor 'com.yanzhenjie.andserver:processor:2.1.12'

    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.alibaba:fastjson:1.1.54.android'

    // Add dependencies.
    implementation 'com.huawei.agconnect:agconnect-core:1.5.2.300'
    implementation 'com.huawei.hms:scanplus:2.12.0.301'

    // zxinglite 扫码
    implementation 'com.github.jenly1314:zxing-lite:3.2.0'

    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // socket 客户端
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json' // 避免与 Android 内置 org.json 冲突
    }

    implementation 'com.huawei.hms:push:6.13.0.300'
    // 添加HMS Core Installer SDK编译依赖，自动引导用户下载HMS Core APK。
    implementation 'com.huawei.hms:hmscoreinstaller:6.7.0.300'
}
